name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Sync deps
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    name: Type-check (mypy strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - run: uv run mypy src/ tests/

  architecture:
    name: Architecture (import-linter)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - run: uv run lint-imports

  unit-test:
    name: Unit tests (Python 3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - name: pytest (unit)
        run: |
          uv run pytest tests/unit \
            --cov=pgschemadiff \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml
          retention-days: 7

  integration-test:
    name: Integration tests (PostgreSQL 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - name: pytest (integration)
        run: |
          uv run pytest tests/integration \
            -v \
            --cov=pgschemadiff \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term-missing

  benchmark:
    name: Benchmarks (PostgreSQL 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Sync deps
        run: uv sync --extra dev
      - name: pytest (benchmark)
        run: uv run pytest tests/benchmark -m benchmark -v -s --benchmark-columns=min,mean,max

  package:
    name: Build package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Build distributions
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Check distribution contents
        run: python scripts/check_dist.py dist
      - name: Smoke test wheel
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/pgsd --version
          /tmp/smoke/bin/pgsd --help
          /tmp/smoke/bin/python -c 'from importlib import resources; catalog = resources.files("pgschemadiff.infrastructure.postgres.catalog"); sql_files = [path for path in catalog.iterdir() if path.name.endswith(".sql")]; assert sql_files and all(path.read_text(encoding="utf-8") for path in sql_files)'
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          retention-days: 7
